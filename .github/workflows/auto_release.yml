name: Auto Build, Release & Firebase Deploy

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'android/**'
      - 'backend/public/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m"

      - name: Prepare Release Artifacts
        id: prep
        run: |
          VERSION_TAG=${GITHUB_REF_NAME:-"v1.2.0"}
          echo "tag=$VERSION_TAG" >> $GITHUB_OUTPUT
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/iamhere-emergency-${VERSION_TAG}.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/iamhere-latest.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: I AM HERE ${{ steps.prep.outputs.tag }} - Android Production Release
          files: |
            release-output/iamhere-emergency-${{ steps.prep.outputs.tag }}.apk
            release-output/iamhere-latest.apk
          generate_release_notes: true
          draft: false
          prerelease: false

  deploy-firebase:
    name: Deploy Web & Telemetry to Firebase Hosting
    needs: build-and-release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd backend
          npm ci

      - name: Run Verification Tests
        run: |
          cd backend
          npm test

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TUSHAR_PORTFOLIO_DEV }}
          channelId: live
          projectId: tushar-portfolio-dev
          target: iamhere-safety
        continue-on-error: true
